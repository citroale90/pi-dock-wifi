# ==============================================================================
# CONFIGURAZIONE INTERFACCIA DI RETE
# Traduzione / Translation: NETWORK INTERFACE CONFIGURATION
# ==============================================================================
# Interfaccia fisica o virtuale su cui dnsmasq deve ascoltare
# Traduzione / Translation: Physical or virtual interface on which dnsmasq listens
interface=br0
# Bind dinamico all'interfaccia (utile se l'IP dell'interfaccia cambia)
# Traduzione / Translation: Dynamic binding follows interface-address changes
bind-dynamic

# ==============================================================================
# CONFIGURAZIONE DHCP (ASSEGNAZIONE DINAMICA)
# Traduzione / Translation: DHCP DYNAMIC ADDRESS ASSIGNMENT
# ==============================================================================
# Range di indirizzi IP assegnati dinamicamente: 10.42.0.50 - 10.42.0.250
# Durata del lease: 12 ore
# Traduzione / Translation: Dynamic pool: 10.42.0.50–10.42.0.250; lease duration 12 hours
dhcp-range=10.42.0.50,10.42.0.250,12h

# Gateway predefinito (Opzione DHCP 3) per tutti i client
# Traduzione / Translation: Default gateway announced to all clients, DHCP option 3
dhcp-option=3,10.42.0.1

# ==============================================================================
# CONFIGURAZIONE ROUTING DINAMICO (OPZIONE 121)
# Traduzione / Translation: DYNAMIC ROUTING CONFIGURATION, OPTION 121
# ==============================================================================
# IMPORTANTE: RFC 3442 impone che option 121 contenga TUTTE le rotte in un'unica
# istanza. Se mandiamo 121 due volte, la seconda sovrascrive la prima e il
# client perde il default gateway.
# Traduzione / Translation: RFC 3442 requires all routes in one option-121 instance. Sending two competing instances can overwrite
# IT/EN: the first and lose the default gateway.

# Solo default route (client con tag no_route: client con tag no_route, non devono rotte verso 10.x)
# PLACEHOLDER route option: enable after configuring the next hop.
# Traduzione / Translation: Default route only for no_route-tagged clients; no extra route towards 10.x. Enable this placeholder
# IT/EN: only after configuring the real next hop.
# dhcp-option=tag:no_route,121,0.0.0.0/0,10.42.0.1

# Default + rotta a 192.0.2.0/24 via 10.42.0.2 (tutti gli altri client)
# NOTA: le rotte verso le reti estese dei satelliti (EXAMPLE_EXTENDED_NETWORKS) sono
# state RIMOSSE: col bridge L2 i client dell'AP dei satelliti ricevono un
# indirizzo 10.42.0.x da questo stesso dnsmasq, reservation comprese.
# PLACEHOLDER route option: enable after configuring the next hop.
# Traduzione / Translation: Other clients receive the default plus 192.0.2.0/24 via 10.42.0.2. Extended satellite-network routes
# IT/EN: were removed: layer-2 bridging gives downstream clients their own 10.42.0.x leases and reservations.
# IT/EN: Configure the next hop before enabling this example.
# dhcp-option=tag:!no_route,121,0.0.0.0/0,10.42.0.1,192.0.2.0/24,10.42.0.2

# ==============================================================================
# CONFIGURAZIONE DNS E RISOLUZIONE NOMI
# Traduzione / Translation: DNS CONFIGURATION AND NAME RESOLUTION
# ==============================================================================
# Server DNS fornito ai client (Opzione DHCP 6)
# Traduzione / Translation: DNS server announced to clients, DHCP option 6
dhcp-option=6,10.42.0.1

# Server DNS upstream per dnsmasq (porta 15353)
# Traduzione / Translation: Upstream DNS server for dnsmasq, port 15353
server=10.42.0.1#15353
# Non usare i file di risoluzione del sistema operativo (/etc/resolv.conf)
# Traduzione / Translation: Do not use the host resolver file /etc/resolv.conf
no-resolv

# Dominio locale configurato
# Traduzione / Translation: Configured local domain
domain=local
# Abilita la risoluzione locale per il dominio "local"
# Traduzione / Translation: Resolve the local domain locally
local=/local/
# Permette la ricircolazione (rebind) per domini sotto "/nat/"
# Traduzione / Translation: Allow the specific DNS rebind exception for the /nat/ suffix
rebind-domain-ok=/nat/
# Espande i nomi host locali
# Traduzione / Translation: Expand local hostnames
expand-hosts

# ==============================================================================
# ASSEGNAZIONI IP STATICHE (DHCP HOSTS)
# Traduzione / Translation: STATIC DHCP RESERVATIONS
# ==============================================================================
# Nota: Per aggiungere dispositivi domotici, copia una riga dhcp-host e modifica:
# MAC_ADDRESS, IP_DESTINAZIONE, NOME_HOST (opzionale), TAG (se necessario)
# Traduzione / Translation: To add devices, copy a dhcp-host example and replace MAC address, destination IP, optional hostname
# IT/EN: and any required tag

# --- Dispositivi NAS (esclusi dal routing verso 192.0.2.x tramite tag no_route) ---
# PLACEHOLDER 1: enable only after replacing MAC, IP and name.
# Traduzione / Translation: Example NAS devices use no_route to omit the extra route towards 192.0.2.x. Enable placeholder 1 only
# IT/EN: after replacing MAC, IP and name.
# dhcp-host=02:00:00:00:01:01,set:no_route,10.42.0.2,example-device-01

# --- IP statico Example computer ---
# PLACEHOLDER 2: enable only after replacing MAC, IP and name.
# Traduzione / Translation: Example-computer reservation: configure MAC, IP and name before enabling placeholder 2
# dhcp-host=02:00:00:00:01:02,10.42.0.8,example-device-02

# --- IP statico per Example NAS per backup NVME-TCP ---
# PLACEHOLDER 3: enable only after replacing MAC, IP and name.
# Traduzione / Translation: Example NAS reservation for NVMe/TCP backup: configure MAC, IP and name before enabling placeholder 3
# dhcp-host=02:00:00:00:01:03,set:no_route,10.42.0.3,example-device-03

# --- Periferiche di Rete (Stampanti) ---
# PLACEHOLDER 4: enable only after replacing MAC, IP and name.
# Traduzione / Translation: Example printer reservations: configure MAC, IP and name before enabling placeholder 4
# dhcp-host=02:00:00:00:01:04,10.42.0.4,example-device-04
# PLACEHOLDER 5: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 5: abilitare soltanto dopo avere sostituito MAC, IP e nome
# dhcp-host=02:00:00:00:01:05,10.42.0.5,example-device-05

# --- Sicurezza (Videocamere) ---
# PLACEHOLDER 6: enable only after replacing MAC, IP and name.
# Traduzione / Translation: Example camera reservations: configure MAC, IP and name before enabling placeholder 6
# dhcp-host=02:00:00:00:01:06,10.42.0.6,example-device-06
# PLACEHOLDER 7: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 7: abilitare soltanto dopo avere sostituito MAC, IP e nome
# dhcp-host=02:00:00:00:01:07,10.42.0.7,example-device-07

# --- [SATELLITI AEGIS / BRIDGE L2] ---
# IP di GESTIONE dei satelliti (pagina web /clients, stream camera, MQTT).
# Col bridge L2 non sono piu' next-hop di niente: i dispositivi collegati
# al loro AP compaiono qui sotto nei lease col LORO MAC, esattamente come
# se fossero attaccati direttamente a questo router.
# METTI I MAC REALI: ogni satellite stampa il suo sul seriale all'avvio.
# PLACEHOLDER 8: enable only after replacing MAC, IP and name.
# Traduzione / Translation: AEGIS satellite management addresses serve /clients, camera and MQTT. With layer-2 bridging,
# IT/EN: satellites are not routing next hops: downstream devices appear with their own MACs. Read each real
# IT/EN: satellite MAC from its serial startup output. Configure placeholder 8 before enabling it.
# dhcp-host=02:00:00:00:01:08,10.42.0.46,example-device-08
# PLACEHOLDER 9: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 9: abilitare soltanto dopo avere sostituito MAC, IP e nome
# dhcp-host=02:00:00:00:01:09,10.42.0.47,example-device-09
# Prossimi satelliti: scommenta, metti MAC e nome definitivo
# Traduzione / Translation: Future satellites: uncomment and set the actual MAC and final hostname
# dhcp-host=02:00:00:00:02:01,10.42.0.240,example-future-device
# dhcp-host=02:00:00:00:02:01,10.42.0.240,example-future-device
# dhcp-host=02:00:00:00:02:01,10.42.0.240,example-future-device

# --- [ZONA DOMOTICA] ---
# Inserisci qui sotto i dispositivi per la domotica (es. lampadine, sensori, termostati)
# Esempio di riga da duplicare e modificare:
# PLACEHOLDER 10: enable only after replacing MAC, IP and name.
# Traduzione / Translation: HOME-AUTOMATION DEVICES: examples for lights, sensors and thermostats. Duplicate a reservation and
# IT/EN: configure MAC, IP and name before enabling placeholder 10.
# dhcp-host=02:00:00:00:01:0a,10.42.0.10,example-device-10
# PLACEHOLDER 11: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 11: abilitare soltanto dopo avere sostituito MAC, IP e nome
# dhcp-host=02:00:00:00:01:0b,10.42.0.11,example-device-11
# PLACEHOLDER 12: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 12: abilitare soltanto dopo avere sostituito MAC, IP e nome
# dhcp-host=02:00:00:00:01:0c,10.42.0.12,example-device-12
# PLACEHOLDER 13: enable only after replacing MAC, IP and name.
# Traduzione / Translation: SEGNAPOSTO 13: abilitare soltanto dopo avere sostituito MAC, IP e nome
