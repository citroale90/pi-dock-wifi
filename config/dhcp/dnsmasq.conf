# ==============================================================================
# CONFIGURAZIONE LEASE E LOGGING
# Traduzione / Translation: LEASE STATE AND LOGGING
# ==============================================================================
# File dove vengono salvati i lease attuali
# Traduzione / Translation: File containing current leases
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Logging per il debug (utile per tracciare query e assegnazioni DHCP)
# Traduzione / Translation: Debug logging for DNS queries and DHCP assignments
log-queries
log-dhcp
